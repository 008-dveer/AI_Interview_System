<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Technical Interview Prep | Master Your Interviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(165, 180, 252, 0.3);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-section {
            margin-top: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .topic-option {
            position: relative;
        }

        .topic-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .topic-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .topic-option input[type="radio"]:checked + .topic-card {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.2);
            color: #ffffff;
            box-shadow: 0 0 0 1px #6366f1;
        }

        .topic-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
        }

        .topic-icon {
            font-size: 20px;
            margin-right: 12px;
        }

        .pill-group {
            display: flex;
            gap: 12px;
        }

        .pill-option {
            flex: 1;
            position: relative;
        }

        .pill-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .pill-card {
            text-align: center;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            transition: all 0.2s ease;
        }

        .pill-option input[type="radio"]:checked + .pill-card {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.2);
            color: #ffffff;
            box-shadow: 0 0 0 1px #6366f1;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 32px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.6);
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--card-border);
            flex-wrap: wrap;
        }

        .feature-item {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feature-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">AI-Powered Evaluation</span>
        <h1>Mock Interview Simulator</h1>
        <p class="subtitle">Sharpen your technical articulation, receive real-time granular AI feedback, and identify key growth areas before real interview day.</p>
    </div>

    <form class="form-section" action="/start" method="POST">
        <div class="form-group">
            <label>Choose Interview Domain</label>
            <div class="topic-grid">
                <label class="topic-option">
                    <input type="radio" name="topic" value="OOP & Software Design" checked>
                    <div class="topic-card">
                        <span class="topic-icon">🧱</span>
                        <span>OOP & System Design</span>
                    </div>
                </label>

                <label class="topic-option">
                    <input type="radio" name="topic" value="Python Developer">
                    <div class="topic-card">
                        <span class="topic-icon">🐍</span>
                        <span>Python Developer</span>
                    </div>
                </label>

                <label class="topic-option">
                    <input type="radio" name="topic" value="Web & Fullstack">
                    <div class="topic-card">
                        <span class="topic-icon">🌐</span>
                        <span>Web & Fullstack</span>
                    </div>
                </label>

                <label class="topic-option">
                    <input type="radio" name="topic" value="Data Structures & Algorithms">
                    <div class="topic-card">
                        <span class="topic-icon">⚡</span>
                        <span>DSA & Algorithms</span>
                    </div>
                </label>

                <label class="topic-option">
                    <input type="radio" name="topic" value="Behavioral & HR">
                    <div class="topic-card">
                        <span class="topic-icon">💼</span>
                        <span>Behavioral & HR</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Number of Questions</label>
            <div class="pill-group">
                <label class="pill-option">
                    <input type="radio" name="count" value="3">
                    <div class="pill-card">⚡ Quick Practice (3 Questions)</div>
                </label>
                <label class="pill-option">
                    <input type="radio" name="count" value="5" checked>
                    <div class="pill-card">🎯 Standard Interview (5 Questions)</div>
                </label>
            </div>
        </div>

        <button type="submit" class="start-btn">
            <span>Begin Technical Interview</span>
            <span>→</span>
        </button>
    </form>

    <div class="features">
        <div class="feature-item">
            <div class="feature-dot"></div>
            <span>Powered by Groq Llama/DeepSeek</span>
        </div>
        <div class="feature-item">
            <div class="feature-dot"></div>
            <span>Speech-to-Text Microphone Mode</span>
        </div>
        <div class="feature-item">
            <div class="feature-dot"></div>
            <span>Printable Diagnostic Report</span>
        </div>
    </div>
</div>

</body>
</html>
